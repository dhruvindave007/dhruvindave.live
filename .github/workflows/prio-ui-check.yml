name: Prio public showcase Playwright check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'portfolio.css'
      - 'prio/**'
      - '.github/workflows/prio-ui-check.yml'
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'portfolio.css'
      - 'prio/**'
      - '.github/workflows/prio-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-and-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIO_SCREENSHOT_DIR: prio-test-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install -r prio/tests/requirements.txt
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Test the portfolio and Prio landing page
        run: python prio/tests/test_ui.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prio-ui-screenshots
          path: prio-test-results/
          if-no-files-found: ignore
