name: Prio public showcase Playwright check
on:
  pull_request:
    paths:
      - 'prio/**'
      - '.github/workflows/prio-ui-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright CLI and browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.56,<2'
          python -m playwright install --with-deps chromium
      - name: Test Prio public landing and interactive demo
        run: python prio/tests/test_ui.py
